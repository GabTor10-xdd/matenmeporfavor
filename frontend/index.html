<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartelera de películas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera__interior">
      <div>
        <h1 class="cabecera__titulo">Cartelera</h1>
        <p class="cabecera__bajada">Tu catálogo personal de películas</p>
      </div>
      <button type="button" id="btn-nueva" class="btn btn--claro">Agregar película</button>
    </div>
  </header>

  <div class="layout">
    <aside class="filtros" aria-labelledby="filtros-titulo">
      <h2 id="filtros-titulo" class="filtros__titulo">Filtrar</h2>
      <form id="form-filtros" novalidate>
        <div class="campo">
          <label for="f-q">Título o director</label>
          <input type="search" id="f-q" name="q" maxlength="100" placeholder="Ej: Nolan">
        </div>
        <div class="campo">
          <label for="f-genero">Género</label>
          <select id="f-genero" name="genero">
            <option value="">Todos los géneros</option>
          </select>
        </div>
        <fieldset class="campo campo--rango">
          <legend>Año de estreno</legend>
          <div class="rango">
            <input type="number" id="f-anio-min" name="anio_min" min="1888" placeholder="Desde" aria-label="Año desde">
            <input type="number" id="f-anio-max" name="anio_max" min="1888" placeholder="Hasta" aria-label="Año hasta">
          </div>
        </fieldset>
        <div class="campo">
          <label for="f-calificacion">Calificación mínima (0 a 10)</label>
          <input type="number" id="f-calificacion" name="calificacion_min" min="0" max="10" step="0.1" placeholder="Ej: 8">
        </div>
        <div class="campo">
          <label for="f-vista">Estado</label>
          <select id="f-vista" name="vista">
            <option value="">Todas</option>
            <option value="true">Vistas</option>
            <option value="false">Pendientes</option>
          </select>
        </div>
        <div class="acciones-filtros">
          <button type="submit" class="btn btn--primario">Buscar</button>
          <button type="button" id="btn-limpiar" class="btn">Limpiar filtros</button>
        </div>
      </form>
    </aside>

    <main class="contenido">
      <div id="banner-error" class="banner" role="alert" hidden>
        <p id="banner-error-texto" class="banner__texto"></p>
        <button type="button" id="btn-reintentar" class="btn btn--chico">Reintentar</button>
      </div>

      <div class="resumen">
        <h2 id="resumen-titulo" class="resumen__titulo">Películas</h2>
        <p id="resumen-filtros" class="resumen__filtros"></p>
      </div>

      <p id="cargando" class="cargando" hidden><span class="cargando__rueda" aria-hidden="true"></span>Cargando películas…</p>
      <ul id="lista" class="lista"></ul>
      <p id="vacio" class="vacio" hidden></p>
    </main>
  </div>

  <dialog id="dlg-pelicula" class="dialogo" aria-labelledby="dlg-pelicula-titulo">
    <form id="form-pelicula" novalidate>
      <h2 id="dlg-pelicula-titulo" class="dialogo__titulo">Nueva película</h2>
      <p id="form-error-general" class="error-general" role="alert" hidden></p>

      <div class="campo">
        <label for="p-titulo">Título</label>
        <input type="text" id="p-titulo" name="titulo" autocomplete="off">
        <p class="campo__error" data-error-de="titulo"></p>
      </div>
      <div class="campo">
        <label for="p-director">Director</label>
        <input type="text" id="p-director" name="director" autocomplete="off">
        <p class="campo__error" data-error-de="director"></p>
      </div>
      <div class="campo">
        <label for="p-genero">Género</label>
        <select id="p-genero" name="genero">
          <option value="">Elige un género</option>
        </select>
        <p class="campo__error" data-error-de="genero"></p>
      </div>
      <div class="fila-campos">
        <div class="campo">
          <label for="p-anio">Año</label>
          <input type="number" id="p-anio" name="anio">
          <p class="campo__error" data-error-de="anio"></p>
        </div>
        <div class="campo">
          <label for="p-duracion">Duración (min)</label>
          <input type="number" id="p-duracion" name="duracion_min">
          <p class="campo__error" data-error-de="duracion_min"></p>
        </div>
        <div class="campo">
          <label for="p-calificacion">Calificación</label>
          <input type="number" id="p-calificacion" name="calificacion" step="0.1">
          <p class="campo__error" data-error-de="calificacion"></p>
        </div>
      </div>
      <div class="campo campo--check">
        <input type="checkbox" id="p-vista" name="vista">
        <label for="p-vista">Ya la vi</label>
        <p class="campo__error" data-error-de="vista"></p>
      </div>
      <div class="campo">
        <label for="p-sinopsis">Sinopsis (opcional)</label>
        <textarea id="p-sinopsis" name="sinopsis" rows="3"></textarea>
        <p class="campo__error" data-error-de="sinopsis"></p>
      </div>

      <div class="dialogo__acciones">
        <button type="button" id="btn-cancelar-form" class="btn">Cancelar</button>
        <button type="submit" id="btn-guardar" class="btn btn--primario">Guardar película</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-eliminar" class="dialogo dialogo--chico" aria-labelledby="dlg-eliminar-titulo">
    <form method="dialog">
      <h2 id="dlg-eliminar-titulo" class="dialogo__titulo"></h2>
      <p>Esta acción no se puede deshacer.</p>
      <div class="dialogo__acciones">
        <button type="submit" value="cancel" class="btn">Cancelar</button>
        <button type="submit" value="ok" class="btn btn--peligro">Eliminar película</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
